name: docker
on:
  push:
    tags: ['v*']
env:
  REGISTRY: docker.io
  IMAGE_NAME: yabbes/kafka-message-scheduler-admin
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Extract version tag
        id: version
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
      - name: Build and push — kafka (full) image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./server/cmd/kafka/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.tag }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build and push — mini image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./server/cmd/mini/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:mini
            ${{ env.IMAGE_NAME }}:mini-${{ steps.version.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
