name: build
on:
  push:
    branches: ['*']
  pull_request:
    branches: ['*']
jobs:
  server-test:
    name: Go — Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Build
        working-directory: ./server
        run: go build ./...
      - name: Test
        working-directory: ./server
        run: go test -count=1 -short ./...
  client-test:
    name: Client — Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: client/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: ./client
        run: pnpm install
      - name: Build
        working-directory: ./client
        run: pnpm run build
      - name: Test
        working-directory: ./client
        run: pnpm test
